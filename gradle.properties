org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 leaves the new DSL and its built-in Kotlin off by default, and this
# module is written against the Kotlin Android plugin and the classic DSL.
# Turning either on would be a rewrite, so they stay off on purpose.
android.newDsl=false
android.builtInKotlin=false

# Those two settings are what AGP reports as deprecation noise on every sync;
# the warnings are expected until the module is migrated.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
